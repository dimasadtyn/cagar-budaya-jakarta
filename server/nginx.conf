# Potongan untuk blok server { } situs ini. root diarahkan ke folder hasil unggahan out/.

root /var/www/cagar-budaya;
index index.html;
error_page 404 /404.html;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# 'unsafe-inline' dibutuhkan skrip bawaan ekspor statis Next; 'wasm-unsafe-eval' untuk dekoder model 3D.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' blob: data: https://tiles.openfreemap.org; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

# Pengalihan URL website HBIM lama (PRD bagian 5)
rewrite ^/tentang-kami/?$ /tentang/ permanent;
rewrite ^/(hbim|point-clouds|plan-section)/?$ /model-3d/ permanent;
rewrite ^/keadaan-bangunan(-museum-[a-z-]+)?/?$ /model-3d/ permanent;
rewrite ^/situs-museum-sejarah/?$ /bangunan/museum-sejarah-jakarta/ permanent;
rewrite ^/situs-museum-tekstil/?$ /bangunan/museum-tekstil/ permanent;
rewrite ^/situs-museum-seni-rupa-dan-keramik/?$ /bangunan/museum-seni-rupa-dan-keramik/ permanent;
rewrite ^/situs-museum-wayang/?$ /bangunan/museum-wayang-no-27/ permanent;
rewrite ^/situs-museum-bahari/?$ /bangunan/museum-bahari/ permanent;

# Halaman berbahasa Inggris lama ke padanannya di /en/. URL /en/ lain yang tidak dikenal: 404.
rewrite ^/en/about-us/?$ /en/about/ permanent;
rewrite ^/en/(hbim|point-clouds|plan-section|building-conservation-status)/?$ /en/3d-models/ permanent;
rewrite ^/en/site-jakarta-history-museum/?$ /en/building/museum-sejarah-jakarta/ permanent;
rewrite ^/en/site-textile-museum/?$ /en/building/museum-tekstil/ permanent;
rewrite ^/en/site-fine-art-and-ceramics-museum/?$ /en/building/museum-seni-rupa-dan-keramik/ permanent;
rewrite ^/en/site-wayang-museum/?$ /en/building/museum-wayang-no-27/ permanent;
rewrite ^/en/site-maritime-museum/?$ /en/building/museum-bahari/ permanent;

# Belum diputuskan Disbud (PRD pertanyaan terbuka #2), sementara 404:
# /arsip-*, /literatur-sejarah, /sumber-referensi, /arsip-referensi, /glosarium

location /_next/static/ {
  add_header Cache-Control "public, max-age=31536000, immutable";
  add_header X-Content-Type-Options "nosniff" always;
}

location /models/ {
  types { model/gltf-binary glb; }
  add_header Cache-Control "public, max-age=604800";
  add_header X-Content-Type-Options "nosniff" always;
}

location / {
  try_files $uri $uri/ $uri.html =404;
}
